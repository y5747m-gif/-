<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0b3d2e">

    <title>دخول المالك | أكاديمية المنى</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">


<div class="login-container">

    <div class="login-card">


        <a href="index.html" class="login-logo">

            <span class="large-mark">
                م
            </span>

            <strong>
                أكاديمية المنى
            </strong>

            <small>
                لوحة الإدارة
            </small>

        </a>


        <div class="login-heading">

            <span class="form-label">
                منطقة خاصة
            </span>

            <h1>
                دخول المالك
            </h1>

            <p>
                هذه الصفحة مخصصة لإدارة الأكاديمية والطلاب.
            </p>

        </div>


        <form id="owner-login-form">


            <div class="field">

                <label for="owner-username">
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    id="owner-username"
                    placeholder="اسم المستخدم"
                    autocomplete="username"
                    required>

            </div>


            <div class="field">

                <label for="owner-password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="owner-password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required>

            </div>


            <div id="login-error" class="login-error">
                بيانات الدخول غير صحيحة
            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block">

                دخول لوحة الإدارة

            </button>

        </form>


        <div class="login-note">

            🔒 هذه الصفحة مخصصة للمالك فقط.

        </div>


        <a href="index.html" class="back-home">
            ← العودة للموقع
        </a>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
